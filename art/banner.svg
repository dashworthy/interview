<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" role="img" aria-label="interview — turns a fuzzy idea into a decided, documented one">
  <defs>
    <radialGradient id="glow" cx="50%" cy="0%" r="70%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#0EA5E9" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#0B1120" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#10B981"/><stop offset="100%" stop-color="#0EA5E9"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0 L0 0 0 48" fill="none" stroke="#1E293B" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="400" fill="#0B1120"/>
  <rect width="1200" height="400" fill="url(#grid)" opacity="0.5"/>
  <rect width="1200" height="400" fill="url(#glow)"/>

  <!-- faint Q&A transcript, vertically centred (motif spans y100–300, centre 200) -->
  <g stroke="#38BDF8" stroke-width="1.5" fill="none" opacity="0.22" stroke-linejoin="round" stroke-linecap="round">
    <rect x="800" y="100" width="172" height="26" rx="13"/>
    <path d="M812 126 l-2 12 l14 -12"/>
    <rect x="800" y="146" width="48" height="18" rx="9"/>
    <rect x="856" y="146" width="48" height="18" rx="9"/>
    <rect x="912" y="146" width="48" height="18" rx="9"/>
    <rect x="800" y="188" width="150" height="26" rx="13"/>
    <path d="M812 214 l-2 12 l14 -12"/>
    <rect x="800" y="234" width="48" height="18" rx="9"/>
    <rect x="856" y="234" width="48" height="18" rx="9"/>
    <rect x="912" y="234" width="48" height="18" rx="9"/>
    <rect x="800" y="264" width="120" height="24" rx="12"/>
    <path d="M780 100 V300" stroke-dasharray="2 6"/>
    <path d="M774 100 H786 M774 300 H786"/>
  </g>

  <!-- the recommended option, lit (the one thing that isn't faint) -->
  <rect x="856" y="146" width="48" height="18" rx="9" fill="#10B981" fill-opacity="0.9"/>
  <path d="M873 155 l4 4 l9 -9" stroke="#04121b" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- wordmark -->
  <text x="72" y="255" font-size="100" font-weight="800" letter-spacing="-0.04em" fill="url(#accent)" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif">interview</text>
  <text x="76" y="296" font-size="22" font-weight="400" fill="#94A3B8" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif">Turns a fuzzy idea into a decided, documented one</text>

  <!-- crafted-by mark -->
  <text x="1180" y="344" text-anchor="end" font-size="9" font-weight="800" font-style="italic" letter-spacing="0.02em" fill="#94A3B8" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif">CRAFTED BY</text>
  <text x="1180" y="362" text-anchor="end" font-size="20" font-weight="900" font-style="italic" letter-spacing="-0.07em" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif"><tspan fill="url(#accent)">DASHWORTHY</tspan></text>
</svg>
